version: '3.7'

services:
    php-apache:
        build:
            context: .
        environment:
            - SYMFONY_PARAMS=${SYMFONY_PARAMS}
        volumes:
            - type: bind
              source: ./src
              target: /usr/src
        ports:
            - '8080:80'

    database:
        image: postgres:13-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_PASSWORD: ChangeMe
            POSTGRES_USER: symfony
        volumes:
            - db-data:/var/lib/postgresql/data:rw
        ports:
            - "5432"

volumes:
    db-data:

